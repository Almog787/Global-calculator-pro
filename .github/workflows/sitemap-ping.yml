name: Sitemap Health & Ping Check (Auto + Manual)

on:
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types:
      - completed
  workflow_dispatch:
    inputs:
      custom_sitemap_url:
        description: 'Sitemap URL to verify'
        required: false
        default: 'https://globalcalcpro.com/sitemap.xml'

concurrency:
  group: 'sitemap-ping'
  cancel-in-progress: true

jobs:
  sitemap-ping:
    name: Verify Live Sitemap & Ping Search Engines
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Sitemap & Ping Search Engines
        run: node scripts/ping-sitemap.js
        env:
          SITEMAP_URL: ${{ github.event.inputs.custom_sitemap_url || 'https://globalcalcpro.com/sitemap.xml' }}
