name: Google Search Console & Indexing API (Manual)

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Submission Action'
        required: true
        default: 'URL_UPDATED'
        type: choice
        options:
          - 'URL_UPDATED'
          - 'URL_DELETED'

jobs:
  google-indexing:
    name: Submit URLs to Google Indexing API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install runtime dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --prefer-offline --no-audit --no-fund
          else
            npm install --omit=dev --no-audit --no-fund
          fi

      - name: Generate Sitemap
        run: node scripts/generate-sitemap.js

      - name: Submit to Google Indexing API
        run: npm run index-site
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          INDEXING_ACTION_TYPE: ${{ github.event.inputs.action_type }}
