name: Google Search Console & Indexing API (Manual)

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Submission Action'
        required: true
        default: 'URL_UPDATED'
        type: choice
        options:
          - 'URL_UPDATED'
          - 'URL_DELETED'


jobs:
  google-indexing:
    name: Submit URLs to Google Indexing API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Submit to Google Indexing API
        run: npm run index-site
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
