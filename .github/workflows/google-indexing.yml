name: Google Search Console & Indexing API (Auto + Manual)

on:
  schedule:
    # Daily automatic batch rotation so all 384+ URLs stay within Google's 200/day quota
    - cron: '0 6 * * *'
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types:
      - completed
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Submission Action'
        required: true
        default: 'URL_UPDATED'
        type: choice
        options:
          - 'URL_UPDATED'
          - 'URL_DELETED'
      batch_mode:
        description: 'Batch Mode (200/day quota protection)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'batch_1'
          - 'batch_2'
          - 'all'
      lang_filter:
        description: 'Language Filter'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'en'
          - 'he'
          - 'es'
          - 'fr'
          - 'ar'
          - 'ru'

concurrency:
  group: 'google-indexing'
  cancel-in-progress: false

jobs:
  google-indexing:
    name: Submit URLs to Google Indexing API
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install runtime dependencies
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --prefer-offline --no-audit --no-fund
          else
            npm install --omit=dev --no-audit --no-fund
          fi

      - name: Generate Sitemap
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}
        run: node scripts/generate-sitemap.js

      - name: Submit to Google Indexing API
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}
        run: npm run index-site
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          INDEXING_ACTION_TYPE: ${{ github.event.inputs.action_type || 'URL_UPDATED' }}
          INDEXING_BATCH_MODE: ${{ github.event.inputs.batch_mode || 'auto' }}
          INDEXING_LANG_FILTER: ${{ github.event.inputs.lang_filter || 'all' }}

      - name: Notice if Service Account Secret Not Configured
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY == '' }}
        run: echo "Skipping Google Indexing API: GOOGLE_SERVICE_ACCOUNT_KEY secret is not configured."
