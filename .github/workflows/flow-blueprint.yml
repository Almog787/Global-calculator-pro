name: FLOW Master Blueprint Runner (Manual)

on:
  workflow_dispatch:
    inputs:
      business_name:
        description: 'שם הנכס / אתר (ריק = שאיבה אוטומטית מ-package.json)'
        required: false
        default: 'Global Calc Pro'
      target_url:
        description: 'כתובת הדומיין הראשית (ריק = שאיבה אוטומטית מ-package.json)'
        required: false
        default: 'https://globalcalcpro.com'

# Minimal required permissions
permissions:
  contents: write

jobs:
  run-blueprint:
    name: Generate FLOW SEO & GEO Blueprint (Live Codebase Data)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute FLOW Master Blueprint Engine
        env:
          FLOW_BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          FLOW_URL: ${{ github.event.inputs.target_url }}
        run: |
          node scripts/run-flow-blueprint.js

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flow-blueprint-reports
          path: flow-blueprint/
          retention-days: 30

      - name: Commit and Push Reports to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flow-blueprint/
          if git diff --staged --quiet; then
            echo "No changes in flow-blueprint/ to commit."
          else
            git commit -m "docs(flow): update FLOW SEO & GEO master blueprint with live codebase data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
