name: Bing & IndexNow Submission (Auto + Manual)

on:
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_engine:
        description: 'Target Search Engine API'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bing'
          - 'yandex'
          - 'naver'

concurrency:
  group: 'indexnow'
  cancel-in-progress: true

jobs:
  indexnow-submission:
    name: Submit URLs to Bing & IndexNow API
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Sitemap
        run: node scripts/generate-sitemap.js

      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: npm run indexnow
        env:
          INDEXNOW_TARGET: ${{ github.event.inputs.target_engine || 'all' }}
