name: Bing & IndexNow Submission (Manual)

on:
  workflow_dispatch:
    inputs:
      target_engine:
        description: 'Target Search Engine API'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bing'
          - 'yandex'
          - 'naver'

jobs:
  indexnow-submission:
    name: Submit URLs to Bing & IndexNow API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Sitemap
        run: node scripts/generate-sitemap.js

      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: npm run indexnow
        env:
          INDEXNOW_TARGET: ${{ github.event.inputs.target_engine }}
